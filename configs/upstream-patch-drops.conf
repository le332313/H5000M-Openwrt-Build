# Upstream patches this build deliberately stops applying.
#
# WHY THIS FILE EXISTS
# --------------------
# OpenWrt main is not a system of record for its own patch series.  Twice in one
# week it landed two patches that fix the SAME lines of the same file, and a
# tree carrying both cannot be built by anyone:
#
#   2026-10-16  package/libs/libjson-c/patches/
#     002-free-objects-outside-assert-in-json_object_put.patch
#       added by e95288dcd5 (2026-10-15T20:06Z), by Javid Khan
#     010-json_object_put-free-container-outside-assert.patch
#       added by f6a2ff7c24 (2026-10-16T11:55Z), by Felix Fietkau
#
# Both rewrite `assert(_json_object_put_maybe_free(jso, 1) == 0);` at line 435
# to hoist the call out of assert(), because the package builds with NDEBUG and
# the free was being compiled away.  002 applies first; 010's context is gone by
# then, so its hunk fails:
#
#   Applying 010-json_object_put-free-container-outside-assert.patch
#   Hunk #1 FAILED at 435.
#   Patch failed! / make[3]: *** [Makefile:69: .../.prepared...] Error 1
#
# The first such tree was fetched by run 38897769334 (unpinned dispatch of
# repo commit d0f17f1) seven minutes after upstream committed 010.  Nothing in
# that run was ours: the pinned baseline is unaffected because it predates both
# patches, which is exactly what the pin is for, but the unpinned path -- the
# one that both tracks main and is the only path that may advance the pin --
# dies in `package/compile` after thirty minutes of compiling.
#
# WHAT A LINE MEANS
# -----------------
#   <package dir, relative to the tree>|<patch to drop>|<guard patch>|<why>
#
#   drop    the patch that is NOT applied any more
#   guard   a patch that must ALSO be present for the drop to happen
#
# The guard is what keeps this file from rotting into a permanent deletion: the
# drop only fires while both patches are there.  Once upstream removes either
# one -- which is the fix we actually want -- the rule stops firing on its own
# and the comment above it becomes the only thing left to clean up.  A rule
# whose guard is missing is reported, not silently skipped.
#
# This is not a patch of our own.  Nothing is rewritten, only not applied; the
# surviving patch is unmodified upstream text, so the leak stays fixed.
#
# Every package listed here is replayed against the real upstream tarball by
# the `patch-series` job in .github/workflows/checks.yml, on both the pinned
# revision and main -- so "upstream landed another duplicate" is answered in
# twenty seconds instead of a thirty-minute build.  Add the rule first, then
# the gate will tell you whether it is the right one.
#
# FORMAT
# ------
# One rule per line, four fields, `|` separated, no `|` inside a field.
# Blank lines and lines whose first non-space character is `#` are ignored.
# Do not delete a rule to "make it go away": if the build no longer needs it,
# the guard is gone and the rule is inert.  Deleting it without a reason
# removes the record of why the tree was touched.
package/libs/libjson-c|002-free-objects-outside-assert-in-json_object_put.patch|010-json_object_put-free-container-outside-assert.patch|Duplicate fix for the same line (435) of json_object.c: 002 landed 2026-10-15, 010 landed 2026-10-16 without 002 being removed, so 002 applies and 010's hunk then fails.  Fixes the identical NDEBUG leak either way.  (更正 2026-10-20：这条注释原来预测「上游会留 010」，实际 main 已撤 010 留 002 —— 但本规则的取舍不受影响，dup-fix 的逻辑照旧成立。)
